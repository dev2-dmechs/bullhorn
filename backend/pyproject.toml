[project]
name = "bullhorn-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "openai>=2.46.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.15.21",
]

# Vercel's Python runtime installs from this file directly (no requirements.txt) — see
# backend/vercel.json / api/index.py. hatchling is the build backend so `pip install .`
# on Vercel can resolve [project.dependencies] above; only the `app` package ships.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags `Depends()` in argument defaults. That is FastAPI's dependency-injection
# idiom, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
